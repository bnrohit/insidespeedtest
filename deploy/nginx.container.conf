# Included in nginx's http context. Only HTTPS is exposed; the FastAPI backend
# listens on host loopback (127.0.0.1:8080), not on the network interface.
limit_req_zone $binary_remote_addr zone=gmcs_sessions:10m rate=4r/m;
limit_conn_zone $binary_remote_addr zone=gmcs_connections:10m;

server {
    listen 443 ssl;
    server_name _;  # Replace with the internal GMCS speed test FQDN when known.
    ssl_certificate /etc/ssl/gmcs-speedtest/fullchain.pem;
    ssl_certificate_key /etc/ssl/gmcs-speedtest/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 9m;
    client_body_timeout 45s;
    keepalive_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    # Nginx overwrites forwarded IP and scheme; never trust client-supplied
    # X-Forwarded-For. If using an upstream TLS proxy, explicitly configure
    # ONLY its known real_ip address first; otherwise school attribution may fail.
    location / {
        limit_conn gmcs_connections 10;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
    location = /api/session {
        limit_req zone=gmcs_sessions burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
